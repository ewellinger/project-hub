[package]
name = "project-hub"
version = "0.22.0"
edition = "2024"
rust-version = "1.88"
description = "Coordinate features that span several git repositories"
license = "MIT"
repository = "https://github.com/ewellinger/project-hub"
readme = "README.md"
keywords = ["git", "worktree", "tmux", "monorepo", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/docs", "/tests", "/.github", "/dist-workspace.toml", "/rustfmt.toml", "/.gitignore"]

[lib]
name = "hub"
path = "src/lib.rs"

[[bin]]
name = "hub"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
fd-lock = "4.0"
inquire = "0.9"
comfy-table = "8.0"
ratatui = "0.30.2"
crossterm = "0.29"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tempfile = "3.27"
assert_cmd = "2.2"
predicates = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
